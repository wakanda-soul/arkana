[workspace]
resolver = "2"
members = ["api", "program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://arkana.cards"
description = "Arkana ORE Sacred Vault: 365-day staking & yield distribution with permanent treasury maturity"

[workspace.dependencies]
bytemuck = "1.14.3"
bytemuck_derive = "1.7.0"
num_enum = "0.7.2"
ore-mint-api = "0.1.3"
ore-stake-api = "0.3.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_derive = "=1.0.217"
serde_json = "=1.0.138"
solana-program = "^2.1"
spl-token = { version = "^4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "^6", features = ["no-entrypoint"] }
steel = { features = ["spl"], version = "4.0.9" }
thiserror = "1.0.57"
az = "=1.2.1"
blake3 = "=1.5.5"
block-buffer = "=0.10.4"
crypto-common = "=0.1.6"
digest = "=0.10.7"
generic-array = "=0.14.7"
proc-macro-crate = "=3.1.0"
toml_edit = "=0.22.24"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
arkana-ore-vault-api = { path = "./api" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
overflow-checks = true
