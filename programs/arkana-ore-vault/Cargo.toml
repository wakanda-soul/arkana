[workspace]
resolver = "2"
members = ["api", "program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://arkana.cards"
description = "Arkana ORE Sacred Vault: 365-day staking & yield distribution with permanent treasury maturity"

[workspace.dependencies]
bytemuck = "1.14.3"
bytemuck_derive = "1.7.0"
num_enum = "0.7.2"
ore-mint-api = "0.1.3"
ore-stake-api = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-program = "^2.1"
spl-token = { version = "^4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "^6", features = ["no-entrypoint"] }
steel = { features = ["spl"], version = "4.0.9" }
thiserror = "1.0.57"
arkana-ore-vault-api = { path = "./api" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.dev]
overflow-checks = true
