name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Solana Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: arkana-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install App Dependencies
        working-directory: ./arkana-app
        run: npm ci

      - name: Expo Prebuild
        working-directory: ./arkana-app
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK (Debug / Release)
        working-directory: ./arkana-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-solana-mobile-apk
          path: arkana-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
