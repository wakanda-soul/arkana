name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Solana Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install App Dependencies
        working-directory: ./arkana-app
        run: npm ci || npm install --legacy-peer-deps

      - name: Expo Prebuild
        working-directory: ./arkana-app
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/debuggableVariants = .*/debuggableVariants = []/' android/app/build.gradle || true

      - name: Build Android APK (Release Standalone)
        working-directory: ./arkana-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          if [ -f arkana-app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp arkana-app/android/app/build/outputs/apk/release/app-release.apk arkana-v1.0.0-beta.apk
          elif [ -f arkana-app/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp arkana-app/android/app/build/outputs/apk/release/app-release-unsigned.apk arkana-v1.0.0-beta.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-solana-mobile-apk
          path: arkana-v1.0.0-beta.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: "Arkana v1.0.3 - Solana Mobile Build"
          body: |
            ### 🔮 Arkana: The Solana Oracle (Mobile Release v1.0.3)
            - Built for **Solana Mobile & Seeker** (versionCode 4, versionName 1.0.3)
            - Direct interface access: app opens straight to the altar without a sign-in block screen.
            - Integrated wallet connection in Altar header and Seeker tab with MWA support.
            - Includes **Mobile Wallet Adapter (MWA)**, **Seed Vault** security, 78-card deck, and **Daily Clock-In** streak retention.
            - Hardened multi-layer prompt injection defense and strict oracle domain boundary.
            - Direct download: install `arkana-v1.0.0-beta.apk` on any Android device or Seeker emulator.
          files: arkana-v1.0.0-beta.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
