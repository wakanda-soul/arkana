name: Build Android APK

on:
  push:
    branches: [ main ]
    # Server, program and docs changes do not need a new APK (use workflow_dispatch to rebuild)
    paths:
      - 'arkana-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: dependency install scripts never see a token that can write to the repo.
# Only the separate release job below gets contents: write.
permissions:
  contents: read

# bash -eo pipefail for every run step: a failing command inside a pipe (e.g. gradle | tee) fails the step
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Solana Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The Android SDK comes preinstalled on ubuntu-latest (ANDROID_HOME is set by the runner image)
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME/build-tools" && ls "$ANDROID_HOME/build-tools" | tail -n 1

      - name: Install App Dependencies
        working-directory: ./arkana-app
        # Exactly the lockfile, nothing else
        run: npm ci

      - name: Dynamic Versioning & Build Info Injection
        working-directory: ./arkana-app
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Semantic version: major.minor from release.json, patch counts builds since that minor started.
          # Bump "version" and set "firstBuild" to the next run number to start a new minor (x.y.0).
          MAJOR_MINOR=$(node -p "require('./release.json').version")
          FIRST_BUILD=$(node -p "require('./release.json').firstBuild")
          PATCH=$(( BUILD_NUM - FIRST_BUILD ))
          if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
          VERSION_NAME="${MAJOR_MINOR}.${PATCH}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          
          echo "=== Setting up dynamic build metadata ==="
          echo "Build Number (versionCode): $BUILD_NUM"
          echo "Version Name: $VERSION_NAME"
          echo "Commit SHA: $SHORT_SHA"

          # Update app.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            pkg.expo.version = '$VERSION_NAME';
            if (!pkg.expo.android) pkg.expo.android = {};
            pkg.expo.android.versionCode = parseInt('$BUILD_NUM', 10);
            if (!pkg.expo.extra) pkg.expo.extra = {};
            pkg.expo.extra.buildNumber = '$BUILD_NUM';
            pkg.expo.extra.commitSha = '$SHORT_SHA';
            fs.writeFileSync('app.json', JSON.stringify(pkg, null, 2));
          "

          # Update package.json version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION_NAME';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Write constants/build-info.ts
          node -e "
            const fs = require('fs');
            const lines = [
              '/**',
              ' * Arkana Build Metadata',
              ' * Dynamically injected during CI/CD build run.',
              ' */',
              'export const APP_VERSION = \"' + '$VERSION_NAME' + '\";',
              'export const BUILD_NUMBER = \"' + '$BUILD_NUM' + '\";',
              'export const COMMIT_SHA = \"' + '$SHORT_SHA' + '\";',
              'export const BUILD_DATE = \"' + new Date().toISOString().split('T')[0] + '\";',
              'export const BUILD_LABEL = \"v' + '$VERSION_NAME' + ' · #' + '$BUILD_NUM' + ' (' + '$SHORT_SHA' + ')\";',
              ''
            ];
            fs.writeFileSync('constants/build-info.ts', lines.join('\n'));
          "

          echo "Updated app.json:"
          grep -E '"version"|"versionCode"' app.json
          echo "Updated constants/build-info.ts:"
          cat constants/build-info.ts

      - name: Expo Prebuild & Configure Build Environment
        working-directory: ./arkana-app
        run: |
          npx expo prebuild --platform android --no-install
          
          # Increase Gradle JVM heap and disable parallel task execution to prevent compiler OOM crashes
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' android/gradle.properties
          
          # Seeker and every current Android phone are arm64; 32-bit armeabi-v7a only added ~20 MB
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          
          # All traffic is HTTPS (arkana.icu); make sure cleartext stays off
          sed -i 's/ android:usesCleartextTraffic="true"//' android/app/src/main/AndroidManifest.xml
          
          # MWA queries for Solana Wallets (Phantom, Solflare, Backpack)
          # Ensure launchMode is singleTask for reliable MWA deep-link intents on Xiaomi/Poco/MIUI
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK (Release Standalone)
        working-directory: ./arkana-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2 2>&1 | tee gradle_build.log || {
            BUILD_STATUS=$?
            echo "=========================================="
            echo "GRADLE BUILD FAILED WITH STATUS: $BUILD_STATUS"
            echo "=========================================="
            echo "=== SYSTEM MEMORY STATUS ==="
            free -h
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-build-failure-log
          path: arkana-app/android/gradle_build.log
          if-no-files-found: ignore

      - name: Sign APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARKANA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARKANA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARKANA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARKANA_KEY_PASSWORD }}
        run: |
          APK_FILE=$(find arkana-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          # Never publish a debug-signed APK: anyone could sign an "update" with the public debug key
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ARKANA_KEYSTORE_* secrets are not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          # apksigner replaces the debug signature that Gradle applied
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_FILE.signed" "$APK_FILE"
          mv "$APK_FILE.signed" "$APK_FILE"
          rm -f "$RUNNER_TEMP/release.jks"
          # The APK must carry the Arkana release certificate: a wrong keystore secret would publish an
          # APK that phones refuse to install as an update
          EXPECTED_CERT_SHA256="CD:87:82:2E:6A:0D:7C:A6:51:7C:BA:E8:2C:3B:DA:A8:6C:5A:7E:82:14:FE:0B:5D:CE:48:24:8F:05:DF:30:7E"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK_FILE")
          head -n 2 <<< "$CERTS"
          ACTUAL_CERT_SHA256=$(grep -m1 'certificate SHA-256 digest:' <<< "$CERTS" | sed 's/.*digest: *//' | tr -d ': \r' | tr 'a-f' 'A-F' || true)
          if [ "$ACTUAL_CERT_SHA256" != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':')" ]; then
            echo "::error::APK signer certificate SHA-256 is '$ACTUAL_CERT_SHA256', expected $EXPECTED_CERT_SHA256."
            exit 1
          fi
          echo "Signer certificate verified: $EXPECTED_CERT_SHA256"

      - name: Prepare APKs for Release
        run: |
          BUILD_NUM="${{ github.run_number }}"
          APK_FILE=$(find arkana-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "arkana-v${VERSION_NAME}.apk"
            # Release metadata for the download server (scripts/sync_release.sh)
            SHA256=$(sha256sum "arkana-v${VERSION_NAME}.apk" | cut -d' ' -f1)
            echo "$SHA256  arkana-v${VERSION_NAME}.apk" > "arkana-v${VERSION_NAME}.apk.sha256"
            printf '{\n  "version": "%s",\n  "buildNumber": %s,\n  "commitSha": "%s",\n  "sha256": "%s",\n  "updatedAt": "%s"\n}\n' \
              "$VERSION_NAME" "$BUILD_NUM" "$SHORT_SHA" "$SHA256" "$(date -u '+%Y-%m-%d %H:%M UTC')" > version.json
            cp "$APK_FILE" arkana-latest.apk
            cp "$APK_FILE" arkana-v1.0.0-beta.apk
            ls -lh arkana-*.apk
          else
            echo "No APK found in release output directory!"
            find arkana-app/android/app/build/outputs -name "*.apk"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arkana-solana-mobile-apk
          path: |
            arkana-v${{ env.VERSION_NAME }}.apk
            arkana-v${{ env.VERSION_NAME }}.apk.sha256
            version.json
            arkana-latest.apk
            arkana-v1.0.0-beta.apk
          retention-days: 30

  release:
    name: Publish to the GitHub release
    needs: build
    # Only builds of main are published (a workflow_dispatch on another branch only builds)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The only job that can write to the repository; it runs no project code
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arkana-solana-mobile-apk

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ls -l
          gh release upload v1.0.0-beta -R "$REPO" --clobber arkana-v*.apk arkana-v*.apk.sha256 arkana-latest.apk version.json
