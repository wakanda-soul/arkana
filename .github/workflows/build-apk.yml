name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Solana Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install App Dependencies
        working-directory: ./arkana-app
        run: npm ci || npm install --legacy-peer-deps

      - name: Dynamic Versioning & Build Info Injection
        working-directory: ./arkana-app
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_NAME="1.0.${BUILD_NUM}"
          
          echo "=== Setting up dynamic build metadata ==="
          echo "Build Number (versionCode): $BUILD_NUM"
          echo "Version Name: $VERSION_NAME"
          echo "Commit SHA: $SHORT_SHA"

          # Update app.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            pkg.expo.version = '$VERSION_NAME';
            if (!pkg.expo.android) pkg.expo.android = {};
            pkg.expo.android.versionCode = parseInt('$BUILD_NUM', 10);
            if (!pkg.expo.extra) pkg.expo.extra = {};
            pkg.expo.extra.buildNumber = '$BUILD_NUM';
            pkg.expo.extra.commitSha = '$SHORT_SHA';
            fs.writeFileSync('app.json', JSON.stringify(pkg, null, 2));
          "

          # Update package.json version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION_NAME';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Write constants/build-info.ts
          node -e "
            const fs = require('fs');
            const lines = [
              '/**',
              ' * Arkana Build Metadata',
              ' * Dynamically injected during CI/CD build run.',
              ' */',
              'export const APP_VERSION = \"' + '$VERSION_NAME' + '\";',
              'export const BUILD_NUMBER = \"' + '$BUILD_NUM' + '\";',
              'export const COMMIT_SHA = \"' + '$SHORT_SHA' + '\";',
              'export const BUILD_DATE = \"' + new Date().toISOString().split('T')[0] + '\";',
              'export const BUILD_LABEL = \"v' + '$VERSION_NAME' + ' · #' + '$BUILD_NUM' + ' (' + '$SHORT_SHA' + ')\";',
              ''
            ];
            fs.writeFileSync('constants/build-info.ts', lines.join('\n'));
          "

          echo "Updated app.json:"
          grep -E '"version"|"versionCode"' app.json
          echo "Updated constants/build-info.ts:"
          cat constants/build-info.ts

      - name: Expo Prebuild & Configure Build Environment
        working-directory: ./arkana-app
        run: |
          npx expo prebuild --platform android --no-install
          
          # Increase Gradle JVM heap and disable parallel task execution to prevent compiler OOM crashes
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' android/gradle.properties
          
          # Target ARM architectures: arm64-v8a (Solana Mobile / Seeker / modern phones) and armeabi-v7a (legacy)
          # Eliminating unused x86 and x86_64 cuts build time in half and keeps APK size sleek for fast downloads
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          
          # Cleartext traffic for local/dev RPC fallback if needed
          grep -q 'android:usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml || true
          
          # MWA queries for Solana Wallets (Phantom, Solflare, Backpack)
          # Ensure launchMode is singleTask for reliable MWA deep-link intents on Xiaomi/Poco/MIUI
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build Android APK (Release Standalone)
        working-directory: ./arkana-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2 2>&1 | tee gradle_build.log || {
            BUILD_STATUS=$?
            echo "=========================================="
            echo "GRADLE BUILD FAILED WITH STATUS: $BUILD_STATUS"
            echo "=========================================="
            echo "=== SYSTEM MEMORY STATUS ==="
            free -h
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: arkana-app/android/gradle_build.log
          if-no-files-found: ignore

      - name: Prepare APKs for Release
        run: |
          BUILD_NUM="${{ github.run_number }}"
          APK_FILE=$(find arkana-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "arkana-v1.0.${BUILD_NUM}.apk"
            cp "$APK_FILE" arkana-latest.apk
            cp "$APK_FILE" arkana-v1.0.0-beta.apk
            ls -lh arkana-*.apk
          else
            echo "No APK found in release output directory!"
            find arkana-app/android/app/build/outputs -name "*.apk" || true
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-solana-mobile-apk
          path: |
            arkana-v1.0.${{ github.run_number }}.apk
            arkana-latest.apk
            arkana-v1.0.0-beta.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: "Arkana v1.0.${{ github.run_number }} (Build #${{ github.run_number }})"
          body: |
            ### Arkana: The Solana Oracle (Build #${{ github.run_number }})
            - **Version**: `v1.0.${{ github.run_number }}`
            - **Android versionCode**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - Built for **Solana Mobile & Seeker**

            #### Download Links:
            - 📦 **Versioned APK**: [`arkana-v1.0.${{ github.run_number }}.apk`](https://github.com/wakanda-soul/arkana/releases/download/v1.0.0-beta/arkana-v1.0.${{ github.run_number }}.apk)
            - ⚡ **Latest APK Alias**: [`arkana-latest.apk`](https://github.com/wakanda-soul/arkana/releases/download/v1.0.0-beta/arkana-latest.apk)
            - 🔄 **Legacy Link**: [`arkana-v1.0.0-beta.apk`](https://github.com/wakanda-soul/arkana/releases/download/v1.0.0-beta/arkana-v1.0.0-beta.apk)

            #### Build Highlights:
            - **Dynamic Automated Versioning**: Every push automatically increments `versionCode` and `versionName`.
            - **Sacred Telemetry Stamp**: In-app build badge on the Profile/ME screen to verify the exact build hash.
            - **MWA Integration**: `singleTask` launchMode preserved for reliable Phantom, Solflare, and Backpack handshakes.
            - **50% Treasury / 50% Burn**: Tokenomics for Ask 1 SKR and Seeker Oracle Pass verified on Solana mainnet.
            - **78 Arcana**: Complete tarot collection with offline caching and obsidian UI.
          files: |
            arkana-v1.0.${{ github.run_number }}.apk
            arkana-latest.apk
            arkana-v1.0.0-beta.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
