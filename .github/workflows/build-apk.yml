name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Solana Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install App Dependencies
        working-directory: ./arkana-app
        run: npm ci || npm install --legacy-peer-deps

      - name: Expo Prebuild
        working-directory: ./arkana-app
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/debuggableVariants = .*/debuggableVariants = []/' android/app/build.gradle || true
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml || true
          grep -q 'solana-wallet' android/app/src/main/AndroidManifest.xml || sed -i 's#</queries>#  <intent><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="solana-wallet"/></intent>\n    <package android:name="app.phantom"/>\n    <package android:name="com.solflare.mobile"/>\n    <package android:name="com.backpack.wallet"/>\n  </queries>#' android/app/src/main/AndroidManifest.xml || true

      - name: Build Android APK (Release Standalone)
        working-directory: ./arkana-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          if [ -f arkana-app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp arkana-app/android/app/build/outputs/apk/release/app-release.apk arkana-v1.0.0-beta.apk
          elif [ -f arkana-app/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp arkana-app/android/app/build/outputs/apk/release/app-release-unsigned.apk arkana-v1.0.0-beta.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-solana-mobile-apk
          path: arkana-v1.0.0-beta.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: "Arkana v1.0.6 - Solana Mobile Build"
          body: |
            ### Arkana: The Solana Oracle (Mobile Release v1.0.6)
            - Built for **Solana Mobile & Seeker** (versionCode 7, versionName 1.0.6)
            - Fixed Android soft keyboard overlapping text input on Ask screen.
            - Added tabBarHideOnKeyboard and reactive scroll-to-end on keyboard show.
            - Complete **Obsidian Ritual** design system (#08070B void, #120E1A surface, #C8A24A gold).
            - Interactive Daily Ritual Core Loop: Tap &rarr; Shuffle &rarr; Pick &rarr; Reveal &rarr; Sign on Solana &rarr; Sealed.
            - Full System Edge States: AI Generating, Tx Failed, Wallet Declined, Limit Reached, Offline.
            - Adaptive Android app icon & splash screen from design system kit.
            - Codex Archetype Collection: 78-card progress bar, full card zoom/inspection, locked teaser cards.
            - Streak Repair: on-chain SKR streak recovery mechanism with dynamic admin pricing.
            - Mobile Wallet Adapter (MWA) & Seed Vault security for Solana Seeker.
            - Direct download: install `arkana-v1.0.0-beta.apk` on any Android device or Seeker emulator.
          files: arkana-v1.0.0-beta.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
